name: iOS CLI source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install device client dependencies
        run: python -m pip install -r ios/device-requirements.txt
      - name: Check CLI and source-only safety tests
        run: |
          python ios/build.py --help
          python -m unittest discover -s ios -p 'test_*.py'
